name: CI
on: [push, pull_request]

# Grant the workflow token read-only access to the repository contents only.
permissions:
  contents: read

jobs:
  build_test:
    name: Build and Test
    strategy:
      matrix:
        go: ['1.13', '1.14', '1.15', '1.16', '1.17', '1.18', '1.19', '1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26', '1.27']
        goexperiment: ['']
        include:
          # Exercise both encoding/json implementations: jsonv2 is opt-in
          # before Go 1.27 and enabled by default from Go 1.27.
          - go: '1.26'
            goexperiment: 'jsonv2'
          - go: '1.27'
            goexperiment: 'nojsonv2'
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
    # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        # Caching is handled explicitly below.
        cache: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ubuntu-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ubuntu-go-
    - name: Test
      run: go test -mod readonly -race ./...
    - name: Test Verbose
      run: go test -mod readonly -race -v ./...

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
